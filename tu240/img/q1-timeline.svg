<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 734" width="820" height="734" role="img" aria-label="เส้นเวลาความขัดแย้งในตะวันออกกลาง" font-family="Plex,'IBM Plex Sans Thai','Noto Sans Thai','Sukhumvit Set',Thonburi,Tahoma,sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>เส้นเวลาความขัดแย้งในตะวันออกกลาง</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2A4A"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6FEB"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8323C"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34A56F"/></marker>
</defs>
<rect width="820" height="734" fill="#fff"/>
<rect x="8" y="24" width="804" height="110" rx="8" fill="#EEF2FF" stroke="none" stroke-width="0"/>
<text x="24" y="79.0" font-size="13" font-weight="700" fill="#2F6FEB" text-anchor="start" dominant-baseline="central">ศาสนาและจักรวรรดิ</text>
<rect x="8" y="138" width="804" height="110" rx="8" fill="#FFF7E6" stroke="none" stroke-width="0"/>
<text x="24" y="193.0" font-size="13" font-weight="700" fill="#B7791F" text-anchor="start" dominant-baseline="central">อาณานิคมและพรมแดน</text>
<rect x="8" y="252" width="804" height="186" rx="8" fill="#FDECEC" stroke="none" stroke-width="0"/>
<text x="24" y="345.0" font-size="13" font-weight="700" fill="#C8323C" text-anchor="start" dominant-baseline="central">น้ำมันและสงครามเย็น</text>
<rect x="8" y="442" width="804" height="110" rx="8" fill="#EAF7F0" stroke="none" stroke-width="0"/>
<text x="24" y="497.0" font-size="13" font-weight="700" fill="#34A56F" text-anchor="start" dominant-baseline="central">หลังสงครามเย็น</text>
<rect x="8" y="556" width="804" height="148" rx="8" fill="#FFF9D6" stroke="none" stroke-width="0"/>
<text x="24" y="630.0" font-size="13" font-weight="700" fill="#8A6D00" text-anchor="start" dominant-baseline="central">ปัจจุบัน</text>
<line x1="250" y1="30" x2="250" y2="694" stroke="#C9D3E0" stroke-width="3"/>
<circle cx="250" cy="42" r="7" fill="#2F6FEB" fill-opacity="1" stroke="#fff" stroke-width="2"/>
<text x="236" y="42.0" font-size="14" font-weight="700" fill="#1B2A4A" text-anchor="end" dominant-baseline="central">632</text>
<text x="266" y="42.0" font-size="14" font-weight="400" fill="#1B2A4A" text-anchor="start" dominant-baseline="central">ซุนนี–ชีอะห์แยกกันหลังศาสดามุฮัมมัดสิ้นพระชนม์</text>
<circle cx="250" cy="80" r="7" fill="#2F6FEB" fill-opacity="1" stroke="#fff" stroke-width="2"/>
<text x="236" y="80.0" font-size="14" font-weight="700" fill="#1B2A4A" text-anchor="end" dominant-baseline="central">1096–1291</text>
<text x="266" y="80.0" font-size="14" font-weight="400" fill="#1B2A4A" text-anchor="start" dominant-baseline="central">สงครามครูเสด แย่งเยรูซาเล็ม</text>
<circle cx="250" cy="118" r="7" fill="#2F6FEB" fill-opacity="1" stroke="#fff" stroke-width="2"/>
<text x="236" y="118.0" font-size="14" font-weight="700" fill="#1B2A4A" text-anchor="end" dominant-baseline="central">1516–1918</text>
<text x="266" y="118.0" font-size="14" font-weight="400" fill="#1B2A4A" text-anchor="start" dominant-baseline="central">ดินแดนอาหรับอยู่ใต้จักรวรรดิออตโตมัน</text>
<circle cx="250" cy="156" r="7" fill="#B7791F" fill-opacity="1" stroke="#fff" stroke-width="2"/>
<text x="236" y="156.0" font-size="14" font-weight="700" fill="#1B2A4A" text-anchor="end" dominant-baseline="central">1916</text>
<text x="266" y="156.0" font-size="14" font-weight="400" fill="#1B2A4A" text-anchor="start" dominant-baseline="central">ข้อตกลงลับไซค์ส–ปีโก แบ่งดินแดนออตโตมัน</text>
<circle cx="250" cy="194" r="7" fill="#B7791F" fill-opacity="1" stroke="#fff" stroke-width="2"/>
<text x="236" y="194.0" font-size="14" font-weight="700" fill="#1B2A4A" text-anchor="end" dominant-baseline="central">1917</text>
<text x="266" y="194.0" font-size="14" font-weight="400" fill="#1B2A4A" text-anchor="start" dominant-baseline="central">คำประกาศบัลโฟร์</text>
<circle cx="250" cy="232" r="7" fill="#B7791F" fill-opacity="1" stroke="#fff" stroke-width="2"/>
<text x="236" y="232.0" font-size="14" font-weight="700" fill="#1B2A4A" text-anchor="end" dominant-baseline="central">1948</text>
<text x="266" y="232.0" font-size="14" font-weight="400" fill="#1B2A4A" text-anchor="start" dominant-baseline="central">ก่อตั้งอิสราเอล · สงครามอาหรับ–อิสราเอล</text>
<circle cx="250" cy="270" r="7" fill="#C8323C" fill-opacity="1" stroke="#fff" stroke-width="2"/>
<text x="236" y="270.0" font-size="14" font-weight="700" fill="#1B2A4A" text-anchor="end" dominant-baseline="central">1953</text>
<text x="266" y="270.0" font-size="14" font-weight="400" fill="#1B2A4A" text-anchor="start" dominant-baseline="central">รัฐประหารอิหร่านหลังโอนกิจการน้ำมัน</text>
<circle cx="250" cy="308" r="7" fill="#C8323C" fill-opacity="1" stroke="#fff" stroke-width="2"/>
<text x="236" y="308.0" font-size="14" font-weight="700" fill="#1B2A4A" text-anchor="end" dominant-baseline="central">1973–74</text>
<text x="266" y="308.0" font-size="14" font-weight="400" fill="#1B2A4A" text-anchor="start" dominant-baseline="central">ประเทศอาหรับคว่ำบาตรน้ำมันต่อสหรัฐฯ</text>
<circle cx="250" cy="346" r="7" fill="#C8323C" fill-opacity="1" stroke="#fff" stroke-width="2"/>
<text x="236" y="346.0" font-size="14" font-weight="700" fill="#1B2A4A" text-anchor="end" dominant-baseline="central">1979</text>
<text x="266" y="346.0" font-size="14" font-weight="400" fill="#1B2A4A" text-anchor="start" dominant-baseline="central">การปฏิวัติอิสลามในอิหร่าน</text>
<circle cx="250" cy="384" r="7" fill="#C8323C" fill-opacity="1" stroke="#fff" stroke-width="2"/>
<text x="236" y="384.0" font-size="14" font-weight="700" fill="#1B2A4A" text-anchor="end" dominant-baseline="central">1980–88</text>
<text x="266" y="384.0" font-size="14" font-weight="400" fill="#1B2A4A" text-anchor="start" dominant-baseline="central">สงครามอิรัก–อิหร่าน</text>
<circle cx="250" cy="422" r="7" fill="#C8323C" fill-opacity="1" stroke="#fff" stroke-width="2"/>
<text x="236" y="422.0" font-size="14" font-weight="700" fill="#1B2A4A" text-anchor="end" dominant-baseline="central">1990–91</text>
<text x="266" y="422.0" font-size="14" font-weight="400" fill="#1B2A4A" text-anchor="start" dominant-baseline="central">อิรักบุกคูเวต · สงครามอ่าวเปอร์เซีย</text>
<circle cx="250" cy="460" r="7" fill="#34A56F" fill-opacity="1" stroke="#fff" stroke-width="2"/>
<text x="236" y="460.0" font-size="14" font-weight="700" fill="#1B2A4A" text-anchor="end" dominant-baseline="central">2001 / 2003</text>
<text x="266" y="460.0" font-size="14" font-weight="400" fill="#1B2A4A" text-anchor="start" dominant-baseline="central">9/11 · สหรัฐฯ บุกอัฟกานิสถานและอิรัก</text>
<circle cx="250" cy="498" r="7" fill="#34A56F" fill-opacity="1" stroke="#fff" stroke-width="2"/>
<text x="236" y="498.0" font-size="14" font-weight="700" fill="#1B2A4A" text-anchor="end" dominant-baseline="central">2011 / 2014</text>
<text x="266" y="498.0" font-size="14" font-weight="400" fill="#1B2A4A" text-anchor="start" dominant-baseline="central">อาหรับสปริง · สงครามซีเรีย · ISIS</text>
<circle cx="250" cy="536" r="7" fill="#34A56F" fill-opacity="1" stroke="#fff" stroke-width="2"/>
<text x="236" y="536.0" font-size="14" font-weight="700" fill="#1B2A4A" text-anchor="end" dominant-baseline="central">2020</text>
<text x="266" y="536.0" font-size="14" font-weight="400" fill="#1B2A4A" text-anchor="start" dominant-baseline="central">ข้อตกลงอับราฮัม</text>
<circle cx="250" cy="574" r="7" fill="#8A6D00" fill-opacity="1" stroke="#fff" stroke-width="2"/>
<text x="236" y="574.0" font-size="14" font-weight="700" fill="#1B2A4A" text-anchor="end" dominant-baseline="central">2023</text>
<text x="266" y="574.0" font-size="14" font-weight="400" fill="#1B2A4A" text-anchor="start" dominant-baseline="central">จีนไกล่เกลี่ยซาอุฯ–อิหร่าน · 7 ต.ค. สงครามกาซา</text>
<circle cx="250" cy="612" r="7" fill="#8A6D00" fill-opacity="1" stroke="#fff" stroke-width="2"/>
<text x="236" y="612.0" font-size="14" font-weight="700" fill="#1B2A4A" text-anchor="end" dominant-baseline="central">2024</text>
<text x="266" y="612.0" font-size="14" font-weight="400" fill="#1B2A4A" text-anchor="start" dominant-baseline="central">อิหร่าน UAE อียิปต์ เข้า BRICS</text>
<circle cx="250" cy="650" r="7" fill="#8A6D00" fill-opacity="1" stroke="#fff" stroke-width="2"/>
<text x="236" y="650.0" font-size="14" font-weight="700" fill="#1B2A4A" text-anchor="end" dominant-baseline="central">มิ.ย. 2025</text>
<text x="266" y="650.0" font-size="14" font-weight="400" fill="#1B2A4A" text-anchor="start" dominant-baseline="central">สงคราม 12 วัน อิสราเอล–อิหร่าน</text>
<circle cx="250" cy="688" r="7" fill="#8A6D00" fill-opacity="1" stroke="#fff" stroke-width="2"/>
<text x="236" y="688.0" font-size="14" font-weight="700" fill="#1B2A4A" text-anchor="end" dominant-baseline="central">ก.พ. 2026</text>
<text x="266" y="688.0" font-size="14" font-weight="400" fill="#1B2A4A" text-anchor="start" dominant-baseline="central">สหรัฐฯ–อิสราเอลโจมตีอิหร่าน · ปิดช่องแคบฮอร์มุซ</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>