<text x="919.0" y="187.5" font-size="11.5" font-weight="400" fill="#5A6270" text-anchor="middle" dominant-baseline="central">และรัน AI</text>
<text x="500" y="22.0" font-size="16" font-weight="700" fill="#1B2A4A" text-anchor="middle" dominant-baseline="central">ซีพียูโน้ตบุ๊กหนึ่งตัวข้ามพรมแดนหลายรอบก่อนถึงผู้ใช้</text>
<text x="518" y="236.0" font-size="13" font-weight="700" fill="#C8323C" text-anchor="start" dominant-baseline="central">จุดที่รัฐเข้ามาคุม ทำให้ไม่ใช่การค้าเสรีเต็มรูปแบบ</text>
