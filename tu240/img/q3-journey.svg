<text x="421.0" y="187.5" font-size="11.5" font-weight="400" fill="#5A6270" text-anchor="middle" dominant-baseline="central">ที่ 3 และ 6 นาโนเมตร</text>
<line x1="493" y1="131" x2="515" y2="131" stroke="#1B2A4A" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="518" y="56" width="138" height="150" rx="12" fill="#EAF6EF" stroke="#34A56F" stroke-width="2"/>
