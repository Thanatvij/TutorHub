<text x="753.0" y="187.5" font-size="11.5" font-weight="400" fill="#5A6270" text-anchor="middle" dominant-baseline="central">และพีซีของแบรนด์ต่างๆ</text>
<line x1="825" y1="131" x2="847" y2="131" stroke="#1B2A4A" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="850" y="56" width="138" height="150" rx="12" fill="#fff" stroke="#1B2A4A" stroke-width="2"/>
