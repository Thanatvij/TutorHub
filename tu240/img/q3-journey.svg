<text x="89.0" y="286.0" font-size="12" font-weight="600" fill="#C8323C" text-anchor="middle" dominant-baseline="central">สหรัฐฯ คุมส่งออก</text>
<text x="89.0" y="302.0" font-size="12" font-weight="600" fill="#C8323C" text-anchor="middle" dominant-baseline="central">ซอฟต์แวร์ออกแบบ</text>
<line x1="89.0" y1="206" x2="89.0" y2="261" stroke="#C8323C" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
<rect x="186" y="262" width="138" height="64" rx="10" fill="#fff" stroke="#C8323C" stroke-width="2"/>
<text x="255.0" y="286.0" font-size="12" font-weight="600" fill="#C8323C" text-anchor="middle" dominant-baseline="central">เนเธอร์แลนด์และสหรัฐฯ</text>
<text x="255.0" y="302.0" font-size="12" font-weight="600" fill="#C8323C" text-anchor="middle" dominant-baseline="central">ไม่ให้ขาย EUV ให้จีน</text>
<line x1="255.0" y1="206" x2="255.0" y2="261" stroke="#C8323C" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
<rect x="352" y="262" width="138" height="64" rx="10" fill="#fff" stroke="#C8323C" stroke-width="2"/>
<text x="421.0" y="286.0" font-size="12" font-weight="600" fill="#C8323C" text-anchor="middle" dominant-baseline="central">ขายชิปขั้นสูงให้จีน</text>
<text x="421.0" y="302.0" font-size="12" font-weight="600" fill="#C8323C" text-anchor="middle" dominant-baseline="central">ต้องมีใบอนุญาต</text>
<line x1="421.0" y1="206" x2="421.0" y2="261" stroke="#C8323C" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
<rect x="518" y="262" width="304" height="64" rx="10" fill="#F3F7FC" stroke="#C9D3E0" stroke-width="1.5"/>
<text x="670.0" y="286.0" font-size="12" font-weight="600" fill="#5A6270" text-anchor="middle" dominant-baseline="central">ทุกขั้นที่ข้ามพรมแดนอาจเจอภาษี</text>
<text x="670.0" y="302.0" font-size="12" font-weight="600" fill="#5A6270" text-anchor="middle" dominant-baseline="central">และเงื่อนไขของรัฐ</text>
<text x="500" y="356.0" font-size="12" font-weight="400" fill="#5A6270" text-anchor="middle" dominant-baseline="central">ตัวอย่าง: ซีพียูโน้ตบุ๊ก Intel Core Ultra 200V (Lunar Lake) ออกแบบโดย Intel แต่ชิ้นส่วนหลักผลิตที่ TSMC</text>
