<text x="587.0" y="134.0" font-size="15" font-weight="700" fill="#1B2A4A" text-anchor="middle" dominant-baseline="central">Intel</text>
<text x="587.0" y="172.5" font-size="11.5" font-weight="400" fill="#5A6270" text-anchor="middle" dominant-baseline="central">นำชิ้นส่วนที่ผลิตแล้ว</text>
<text x="587.0" y="187.5" font-size="11.5" font-weight="400" fill="#5A6270" text-anchor="middle" dominant-baseline="central">มาต่อรวมเป็นซีพียูตัวเดียว</text>
