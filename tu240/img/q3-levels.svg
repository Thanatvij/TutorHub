<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-label="การรวมกลุ่มทางเศรษฐกิจ 5 ระดับ" font-family="Plex,'IBM Plex Sans Thai','Noto Sans Thai','Sukhumvit Set',Thonburi,Tahoma,sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>การรวมกลุ่มทางเศรษฐกิจ 5 ระดับ</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2A4A"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6FEB"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8323C"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34A56F"/></marker>
</defs>
<rect width="820" height="400" fill="#fff"/>
<rect x="20" y="270" width="152" height="90" rx="8" fill="#EAF1FF" stroke="#2F6FEB" stroke-width="1.5"/>
<text x="96.0" y="294.0" font-size="14" font-weight="700" fill="#1B2A4A" text-anchor="middle" dominant-baseline="central">1. เขตการค้าเสรี</text>
<text x="96.0" y="320.0" font-size="11.5" font-weight="500" fill="#1B2A4A" text-anchor="middle" dominant-baseline="central">ยกเลิกภาษีระหว่างสมาชิก</text>
<text x="96.0" y="344.0" font-size="11.5" font-weight="400" fill="#5A6270" text-anchor="middle" dominant-baseline="central">AFTA · RCEP · USMCA</text>
<rect x="176" y="218" width="152" height="142" rx="8" fill="#DCE7FD" stroke="#2F6FEB" stroke-width="1.5"/>
<text x="252.0" y="242.0" font-size="14" font-weight="700" fill="#1B2A4A" text-anchor="middle" dominant-baseline="central">2. สหภาพศุลกากร</text>
<text x="252.0" y="268.0" font-size="11.5" font-weight="500" fill="#1B2A4A" text-anchor="middle" dominant-baseline="central">+ ภาษีภายนอกร่วม</text>
<text x="252.0" y="292.0" font-size="11.5" font-weight="400" fill="#5A6270" text-anchor="middle" dominant-baseline="central">EU Customs Union</text>
<rect x="332" y="166" width="152" height="194" rx="8" fill="#C9DAFB" stroke="#2F6FEB" stroke-width="1.5"/>
<text x="408.0" y="190.0" font-size="14" font-weight="700" fill="#1B2A4A" text-anchor="middle" dominant-baseline="central">3. ตลาดร่วม</text>
<text x="408.0" y="216.0" font-size="11.5" font-weight="500" fill="#1B2A4A" text-anchor="middle" dominant-baseline="central">+ ทุน แรงงาน เคลื่อนย้ายเสรี</text>
<text x="408.0" y="240.0" font-size="11.5" font-weight="400" fill="#5A6270" text-anchor="middle" dominant-baseline="central">ตลาดร่วมยุโรป</text>
<rect x="488" y="114" width="152" height="246" rx="8" fill="#B4CBF8" stroke="#2F6FEB" stroke-width="1.5"/>
<text x="564.0" y="138.0" font-size="14" font-weight="700" fill="#1B2A4A" text-anchor="middle" dominant-baseline="central">4. สหภาพเศรษฐกิจ</text>
<text x="564.0" y="164.0" font-size="11.5" font-weight="500" fill="#1B2A4A" text-anchor="middle" dominant-baseline="central">+ เงินสกุลเดียว นโยบายร่วม</text>
<text x="564.0" y="188.0" font-size="11.5" font-weight="400" fill="#5A6270" text-anchor="middle" dominant-baseline="central">สหภาพยุโรป</text>
<rect x="644" y="62" width="152" height="298" rx="8" fill="#9EBBF5" stroke="#2F6FEB" stroke-width="1.5"/>
<text x="720.0" y="86.0" font-size="14" font-weight="700" fill="#1B2A4A" text-anchor="middle" dominant-baseline="central">5. สหภาพการเมือง</text>
<text x="720.0" y="112.0" font-size="11.5" font-weight="500" fill="#1B2A4A" text-anchor="middle" dominant-baseline="central">+ รัฐบาลร่วม</text>
<text x="720.0" y="136.0" font-size="11.5" font-weight="400" fill="#5A6270" text-anchor="middle" dominant-baseline="central">ยังไม่มีตัวอย่างสมบูรณ์</text>
<line x1="96" y1="95" x2="96" y2="262" stroke="#C2410C" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="96" y="75.0" font-size="13" font-weight="700" fill="#C2410C" text-anchor="middle" dominant-baseline="central">เอเชียส่วนใหญ่อยู่ขั้นนี้</text>
<text x="410" y="386.0" font-size="12.5" font-weight="500" fill="#5A6270" text-anchor="middle" dominant-baseline="central">ระดับยิ่งสูง ประเทศสมาชิกยิ่งต้องสละอำนาจกำหนดนโยบายให้กลุ่มมากขึ้น</text>
